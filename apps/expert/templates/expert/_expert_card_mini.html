{% load i18n %}
{# Mini Expert Card — horizontal compact for Accordion body #}
<a href="{{ expert.get_absolute_url }}"
   class="group flex items-center gap-3 p-2.5 rounded-lg hover:bg-blue-50 transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500">

  {# Avatar #}
  <div class="flex-shrink-0 w-9 h-9 rounded-full overflow-hidden bg-primary-50 border border-slate-200">
    {% if expert.avatar %}
      <img src="{{ expert.avatar.url }}"
           alt="{% blocktrans with name=expert.display_name %}Ảnh {{ name }}{% endblocktrans %}"
           class="w-full h-full object-cover object-top" loading="lazy" />
    {% else %}
      <div class="w-full h-full flex items-center justify-center bg-primary-100">
        <svg class="w-4 h-4 text-primary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
    {% endif %}
  </div>

  {# Info #}
  <div class="flex-1 min-w-0">
    <p class="text-sm font-semibold text-primary-900 leading-tight line-clamp-1 group-hover:text-primary-700">
      {{ expert.display_name }}
    </p>
    {% if expert.position %}
      <p class="text-xs text-slate-500 line-clamp-1">{{ expert.position }}</p>
    {% endif %}
  </div>

  <svg class="w-4 h-4 text-slate-300 flex-shrink-0 group-hover:text-primary-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
  </svg>

</a>
