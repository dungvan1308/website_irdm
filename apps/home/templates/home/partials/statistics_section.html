{% load i18n %}
<section
  class="bg-primary-900 py-16"
  aria-label="{% trans 'Key statistics' %}"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-8 lg:gap-12">
      {% for item in statistics %}
        <div class="text-center">
          <p class="text-3xl sm:text-4xl font-bold text-white mb-2">{{ item.value }}</p>
          <p class="text-sm font-semibold text-primary-300 uppercase tracking-wide mb-1">{{ item.label }}</p>
          {% if item.description %}
            <p class="text-xs text-white/50">{{ item.description }}</p>
          {% endif %}
        </div>
      {% endfor %}
    </div>
  </div>
</section>
