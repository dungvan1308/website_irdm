{% load i18n %}
<section
  class="bg-primary-900 py-16"
  aria-label="{% trans 'Key statistics' %}"
  hx-get="{% url 'home:statistics' %}"
  hx-trigger="revealed"
  hx-swap="outerHTML"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-8 lg:gap-12">
      {% for item in statistics %}
        <div class="text-center">
          {% if item.icon %}
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary-800 mb-4 mx-auto">
              <svg class="w-6 h-6 text-primary-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <use href="#icon-{{ item.icon }}"/>
              </svg>
            </div>
          {% endif %}
          <p class="text-3xl sm:text-4xl font-bold text-white mb-2">{{ item.value }}</p>
          <p class="text-sm font-semibold text-primary-300 uppercase tracking-wide mb-1">{{ item.label }}</p>
          {% if item.description %}
            <p class="text-xs text-white/50">{{ item.description }}</p>
          {% endif %}
        </div>
      {% endfor %}
    </div>
  </div>
</section>
